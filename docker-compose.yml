version: '3.8'

services:
  spring-app:
    build: .
    container_name: ac1_spring_app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/ac1_atdd_dev
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    ports:
      - "8080:8080"
    networks:
      - ac1_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: ac1_frontend
    environment:
      VITE_API_URL: http://spring-app:8080
    ports:
      - "3000:3000"
    networks:
      - ac1_network
    depends_on:
      - spring-app

networks:
  ac1_network:
    driver: bridge
