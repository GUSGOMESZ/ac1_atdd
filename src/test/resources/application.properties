# Perfil de testes: banco H2 em memoria (nao precisa do PostgreSQL rodando)
spring.application.name=ac1_atdd
spring.datasource.url=jdbc:h2:mem:ac1_atdd_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
